function menuAction(){if(menuPage===0){if(inventory.herb>0){inventory.herb--;player.hp=Math.min(player.max,player.hp+12);party[0].hp=Math.min(party[0].max,party[0].hp+8);toast('약초를 나눠 먹었다.')}else toast('남은 약초가 없다.')}else menuPage=(menuPage+1)%3;saveGame()}
function saveGame(){try{localStorage.setItem(saveKey,JSON.stringify({player,party,inventory,flags,log,area}));document.querySelector('#continueGame').classList.remove('hidden')}catch(e){}}
function loadGame(){try{let d=JSON.parse(localStorage.getItem(saveKey)||'null');if(!d)return false;blankGame();player={...player,...d.player};player.tx=player.x*TILE;player.ty=player.y*TILE;player.px=player.tx;player.py=player.ty;party=d.party||party;inventory=d.inventory||inventory;flags=d.flags||flags;log=d.log||log;area=d.area||area;state='play';title.classList.add('hidden');playMusic();return true}catch(e){return false}}
let audio=null,musicOn=true;
function initAudio(){if(audio)return;try{let AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audio=new AC();let master=audio.createGain();master.gain.value=.12;master.connect(audio.destination);let a=audio.createOscillator(),b=audio.createOscillator(),g=audio.createGain(),filter=audio.createBiquadFilter();a.type='sine';b.type='triangle';a.frequency.value=55;b.frequency.value=82.4;g.gain.value=.13;filter.type='lowpass';filter.frequency.value=320;a.connect(filter);b.connect(filter);filter.connect(g);g.connect(master);a.start();b.start();audio.master=master;audio.musicGain=g}catch(e){}}
function playMusic(){if(!musicOn)return;initAudio();if(audio&&audio.state==='suspended')audio.resume();if(audio)audio.musicGain.gain.setTargetAtTime(.13,audio.currentTime,.7)}
function beep(freq=220,dur=.1,vol=.04,type='sine'){if(!musicOn)return;initAudio();if(!audio)return;try{let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g);g.connect(audio.master);o.start();o.stop(audio.currentTime+dur)}catch(e){}}
function toggleMenu(){if(state==='play'){state='menu';menuPage=0;saveGame()}else if(state==='menu')state='play'}
function action(){if(state==='title')startGame();else if(state==='menu')menuAction();else if(state==='combat')combatAction();else interact()}
function render(){ctx.clearRect(0,0,W,H);if(!player){ctx.fillStyle='#111015';ctx.fillRect(0,0,W,H);return}drawWorld();drawHud();if(state==='combat')drawBattle();if(state==='menu')drawMenu();if(shake>0){shake*=.78;if(shake<.3)shake=0}}
function frame(ts){let dt=Math.min(.05,(ts-last)/1000||0);last=ts;elapsed+=dt;worldTime+=dt;if(player){player.px+=(player.tx-player.px)*Math.min(1,dt*15);player.py+=(player.ty-player.py)*Math.min(1,dt*15)}render();requestAnimationFrame(frame)}
function chooseDir(d){let v={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[d];if(v)move(...v)}
window.addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' ','escape'].includes(k))e.preventDefault();if(state==='title'){if(k==='enter'||k==='z'||k===' ')action();return}if(k==='escape'||k==='x'||k==='backspace'){toggleMenu();return}if(state==='menu'){if(k==='arrowleft'||k==='a')menuPage=(menuPage+2)%3;else if(k==='arrowright'||k==='d')menuPage=(menuPage+1)%3;else if(k==='z'||k==='enter'||k===' ')menuAction();return}if(state==='combat'){if(k==='arrowleft'||k==='a')combat.sel=(combat.sel+3)%4;else if(k==='arrowright'||k==='d')combat.sel=(combat.sel+1)%4;else if(['1','2','3','4'].includes(k))combatAction(Number(k)-1);else if(k==='z'||k==='enter'||k===' ')combatAction();return}if(k==='arrowup'||k==='w')chooseDir('up');else if(k==='arrowdown'||k==='s')chooseDir('down');else if(k==='arrowleft'||k==='a')chooseDir('left');else if(k==='arrowright'||k==='d')chooseDir('right');else if(k==='z'||k==='enter'||k===' ')interact()});
document.querySelector('#newGame').addEventListener('click',()=>{startGame();saveGame()});document.querySelector('#continueGame').addEventListener('click',()=>{if(!loadGame())startGame()});document.querySelector('#menuBtn').addEventListener('click',toggleMenu);document.querySelector('#touchMenu').addEventListener('click',toggleMenu);document.querySelector('#touchAct').addEventListener('click',action);document.querySelector('#soundBtn').addEventListener('click',()=>{musicOn=!musicOn;document.querySelector('#soundBtn').textContent=musicOn?'♫ ON':'♫ OFF';if(musicOn)playMusic();else if(audio)audio.musicGain.gain.setTargetAtTime(0,audio.currentTime,.2)});function toggleLanguage(){lang=lang==='ko'?'en':'ko';localStorage.setItem('ashen-wilds-lang',lang);updateLanguage()}document.querySelector('#langBtn').addEventListener('click',toggleLanguage);document.querySelector('#titleLang').addEventListener('click',toggleLanguage);updateLanguage();
document.querySelectorAll('.mobilepad button').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();chooseDir(b.dataset.dir)})});
canvas.addEventListener('pointerdown',e=>{let r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;if(state==='combat'){if(combat.phase==='result'){finishBattle();return}if(y>435&&y<505){combatAction(Math.max(0,Math.min(3,Math.floor((x-40)/166))))}else if(x<370)combat.sel=(combat.sel+3)%4;else combat.sel=(combat.sel+1)%4}else if(state==='menu'){if(y>480&&y<525)menuPage=Math.max(0,Math.min(2,Math.floor((x-185)/112)));else if(x>730&&y>515)toggleMenu()}else if(state==='play'){if(x>745)toggleMenu();else action()}});
if(localStorage.getItem(saveKey))document.querySelector('#continueGame').classList.remove('hidden');blankGame();requestAnimationFrame(frame);
